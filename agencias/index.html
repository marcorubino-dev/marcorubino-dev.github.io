/* ========================================
   PROCESO
   ======================================== */

.proceso-conector {
    position: relative;
}

.proceso-conector
.kt-row-column-wrap
> .wp-block-kadence-column {
    position: relative;
}

.proceso-conector .paso-numero {
    position: relative;
    z-index: 2;
    /* margin-bottom: 8px; */
}


/* ----------------------------------------
   DESKTOP
   Conector horizontal
   ---------------------------------------- */

.proceso-conector
.kt-row-column-wrap
> .wp-block-kadence-column:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 20px;
    left: 35px;
    right: -30px;
    height: 1px;
    background: #4DA3FF66;
    z-index: -1;
}


/* ----------------------------------------
   TABLET / MOBILE
   Pasos apilados
   ---------------------------------------- */

@media (max-width: 1024px) {

    /* Contenedor interno */
    .proceso-conector
    .kt-row-column-wrap
    > .wp-block-kadence-column
    > .kt-inside-inner-col {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center !important;
    }

    /* Número */
    .proceso-conector
    .kt-inside-inner-col
    .paso-numero {
        width: 100%;
        text-align: center !important;
    }

    /* Título */
    .proceso-conector
    .kt-inside-inner-col
    .paso-titulo {
        width: 100%;
        text-align: center !important;
    }

    /* Descripción */
    .proceso-conector
    .kt-inside-inner-col
    > p {
        width: 100%;
        text-align: center !important;
    }

    /* Anular explícitamente las clases de Gutenberg */
    .proceso-conector
    .has-text-align-left {
        text-align: center !important;
    }

    /* ------------------------------------
       Conector vertical
       ------------------------------------ */

    .proceso-conector
    .kt-row-column-wrap
    > .wp-block-kadence-column:not(:last-child)::after {
        top: auto;
        left: 50%;
        right: auto;
        bottom: -32px;
        width: 1px;
        height: 32px;
        transform: translateX(-50%);
        background: #4DA3FF !important;
        z-index: 1;
    }
}

/* ========================================
   PORTFOLIO
   Thumbnails
   ======================================== */

#portfolio .portfolio-thumbnail img {
    opacity: 0.55;
    cursor: pointer;
    border: 1px solid transparent;
    box-sizing: border-box;
    transition:
        opacity 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
}

/* Thumbnail activo */

#portfolio .portfolio-thumbnail img.is-active {
    opacity: 1;
    border: solid 1.5px #4DA3FF !important;
    box-shadow: 0 0 8px rgba(77, 163, 255, 0.28);
}

/* Hover */

#portfolio .portfolio-thumbnail:hover img {
    opacity: 1;
}


/* ========================================
   PORTFOLIO
   Selectores de proyectos
   ======================================== */

#portfolio .portfolio-project h4 {
    cursor: pointer;
    position: relative;
    display: inline-block;
    transition:
        color 180ms ease,
        opacity 180ms ease;
}


/* Proyecto inactivo */

#portfolio .portfolio-project h4:not(.is-active) {
    opacity: 0.55;
}


/* Proyecto activo */

#portfolio .portfolio-project h4.is-active {
    opacity: 1;
    color: #F1F5F9;
}


/* Indicador activo */

#portfolio .portfolio-project h4::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 2px;
    background: #4DA3FF;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 180ms ease;
}

#portfolio .portfolio-project h4.is-active::after {
    transform: scaleX(1);
}


/* Focus teclado */

#portfolio .portfolio-project h4:focus-visible {
    outline: 2px solid #4DA3FF;
    outline-offset: 4px;

.motion-reveal {
    opacity: 0;
    transform: translateY(24px);
    transition:
        opacity 1.2s ease,
        transform 2s cubic-bezier(.22, 1, .36, 1);
}

.motion-reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
}

/* ========================================
   MOTION — STAGGER
   ======================================== */

.motion-stagger > * {
    opacity: 0;
    transform: translateY(24px);
}

.motion-stagger.is-visible > * {
    opacity: 1;
    transform: translateY(0);
    transition:
        opacity 1.2s ease,
        transform 2s cubic-bezier(.22, 1, .36, 1);
}

.motion-stagger.is-visible > *:nth-child(1) {
    transition-delay: 0s;
}

.motion-stagger.is-visible > *:nth-child(2) {

}

.motion-stagger.is-visible > *:nth-child(3) {
    transition-delay: 0.24s;
}

.motion-stagger.is-visible > *:nth-child(4) {
    transition-delay: 0.36s;
}

.motion-stagger.is-visible > *:nth-child(5) {
    transition-delay: 0.48s;
